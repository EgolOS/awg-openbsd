# Untrusted pull requests execute only on disposable GitHub-hosted runners.
# Kernel builds are an explicit operator action in a disposable OpenBSD lab.
# Do not register a persistent privileged runner for this workflow.
name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install offline signature-test tool
        run: sudo apt-get update && sudo apt-get install -y signify-openbsd
      - name: make check
        run: make check
      - name: assert awg-openbsd.patch is current
        run: sh generate-patch.sh --check
